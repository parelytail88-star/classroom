<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องเรียนครูแพร</title>
<!-- หน้าครอบเว็บนักเรียน: มีไว้ให้ "เพิ่มไปยังหน้าจอหลัก" ได้ไอคอนทั้ง iPhone และ Android -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ห้องเรียนครูแพร">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1D3C94">
<style>
  html, body { margin: 0; height: 100%; background: #1D3C94; overflow: hidden; }
  body { padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #EDF1FA; }
  .wait { position: fixed; inset: 0; display: grid; place-items: center; color: #FFC72C; font: 600 18px sans-serif; pointer-events: none; z-index: 1; }
</style>
</head>
<body>
<div class="wait" id="wait">กำลังเปิดห้องเรียน…</div>
<!-- ลิงก์เว็บนักเรียน (เว็บแอปของระบบติดตามงาน) ถ้า deploy ใหม่แล้วลิงก์เปลี่ยน ให้แก้บรรทัดนี้บรรทัดเดียว -->
<iframe id="app" title="ห้องเรียนครูแพร" allow="camera; clipboard-write"
  src="https://script.google.com/macros/s/AKfycbyolvoWhT1DI7n5Wk8I_9wcw3CGF8AVZvRoOFYN4SuJSxjO2uWbs9C3pY1bD8RPCWh-3A/exec"
  onload="document.getElementById('wait').style.display='none'"></iframe>
</body>
</html>
